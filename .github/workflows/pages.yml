name: Publish family finance PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_URL: https://family-finance-gateway.massahg.workers.dev
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

      - name: Verify public site and assets after deployment
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://morkov-d.github.io/family-finance-pwa/"
          echo "Checking public page: $SITE"
          for attempt in $(seq 1 12); do
            if curl --max-time 20 --fail --silent --show-error --location --header 'Cache-Control: no-cache' "${SITE}?healthcheck=${GITHUB_SHA}" --output /tmp/pwa-page.html; then
              echo "Public HTML reachable on attempt ${attempt}"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published HTML is unavailable" >&2
              exit 1
            fi
            sleep 5
          done
          if ! grep -q 'id="root"' /tmp/pwa-page.html; then
            echo "Public page does not contain React root element." >&2
            head -c 300 /tmp/pwa-page.html
            exit 1
          fi
          grep -oE '/family-finance-pwa/assets/[^" ]+\\.(js|css)' /tmp/pwa-page.html | sort -u > /tmp/pwa-assets.txt || true
          if [ ! -s /tmp/pwa-assets.txt ]; then
            echo "No built JS/CSS found in published HTML" >&2
            cat /tmp/pwa-page.html
            exit 1
          fi
          while IFS= read -r path; do
            echo "Checking asset ${path}"
            curl --fail --silent --show-error --location --max-time 20 --output /dev/null "https://morkov-d.github.io${path}"
          done < /tmp/pwa-assets.txt
          echo "Published HTML and assets are reachable."
